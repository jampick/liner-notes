<!doctype html>
<html lang="en">
<head>

<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="icon" href="data:,">
<!-- The bridge puts its per-start token here when it serves the page; POSTs to the bridge carry it. -->

<!-- Web fonts load only in a shared copy; a page the bridge serves uses the desktop's fonts (its CSP allows no others). -->

<style>
/* Layout: a fixed era photograph behind everything, the coastline chart across the top,
   one stop at a time below it (cover and controls left, the notes right), walk bar at the bottom. */
:root {
  --bg: #e3ebea; --panel: rgba(227,235,234,0.82); --panel-solid: #e3ebea; --ink: #17303a; --mid: #33505b; --faint: #4d6873;
  --sea: #2b6372; --amber: #a8672b; --amber-ink: #fff8ef; --rule: rgba(23,48,58,0.14); --card: rgba(23,48,58,0.06);
  --band-a: rgba(43,99,114,0.12); --band-b: rgba(43,99,114,0.05); --band-warm: rgba(168,103,43,0.14);
  --veil-top: rgba(227,235,234,0.80); --veil-bottom: rgba(227,235,234,0.94); --grain: 0.10;
  --display: "Spectral", "Noto Serif", "Liberation Serif", Georgia, serif; --body: "Spectral", "Noto Serif", "Liberation Serif", Georgia, serif; --mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b161a; --panel: rgba(11,22,26,0.74); --panel-solid: #0f1d22; --ink: #dbe7e5; --mid: #a9bfc0; --faint: #87a0a4;
  --sea: #74b8c4; --amber: #e0a35f; --amber-ink: #1a1208; --rule: rgba(219,231,229,0.14); --card: rgba(219,231,229,0.05);
  --band-a: rgba(116,184,196,0.10); --band-b: rgba(116,184,196,0.04); --band-warm: rgba(224,163,95,0.12);
  --veil-top: rgba(8,16,19,0.62); --veil-bottom: rgba(8,16,19,0.92); --grain: 0.14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b161a; --panel: rgba(11,22,26,0.74); --panel-solid: #0f1d22; --ink: #dbe7e5; --mid: #a9bfc0; --faint: #87a0a4;
  --sea: #74b8c4; --amber: #e0a35f; --amber-ink: #1a1208; --rule: rgba(219,231,229,0.14); --card: rgba(219,231,229,0.05);
  --band-a: rgba(116,184,196,0.10); --band-b: rgba(116,184,196,0.04); --band-warm: rgba(224,163,95,0.12);
  --veil-top: rgba(8,16,19,0.62); --veil-bottom: rgba(8,16,19,0.92); --grain: 0.14; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--sea); text-underline-offset: 3px; }
a:hover { color: var(--amber); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }

/* The era photograph, a veil to keep text legible, and film grain. */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2.4s ease-in-out; transform: scale(1.04); }
.scene img.on { opacity: 1; animation: drift 60s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1.04) translate(0,0); } to { transform: scale(1.10) translate(-1.5%, -1%); } }
.scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--veil-top), var(--veil-bottom) 55%); }
/* The grain layer is 20% bigger than the viewport, enough for its 3% steps. At twice the viewport it took four
   times the raster memory, a 3840x2160 layer on a 1080p screen, animated forever. */
.grain { position: fixed; inset: -10%; z-index: 1; pointer-events: none; opacity: var(--grain); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 1.2s steps(6) infinite; }
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }

.app { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 1360px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { padding-block: 16px 6px; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 12px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand b { font-family: var(--display); font-weight: 300; font-size: 26px; letter-spacing: -0.01em; }
.brand b i { font-weight: 500; color: var(--sea); }
.brand span { color: var(--faint); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { min-height: 36px; padding: 0 12px; border: 1px solid var(--rule); background: var(--panel); color: var(--mid); border-radius: 18px; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; backdrop-filter: blur(6px); }
.chip:hover { color: var(--ink); border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lenses { display: flex; flex-wrap: wrap; gap: 6px; }
.chip .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 7px; vertical-align: 1px; }
.chip[aria-pressed="true"] .live-dot { background: var(--amber); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
#followBtn { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The coastline chart */
.chart { position: relative; z-index: 4; padding-block: 8px 4px; }
.chart .scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.coast { position: relative; min-width: 900px; }
.eras { display: grid; gap: 0; }
.eras button { all: unset; cursor: pointer; padding: 0 8px 6px; border-left: 1px solid var(--rule); font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eras button:hover, .eras button.here { color: var(--ink); }
.years { display: grid; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.yr { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 10px; min-height: 104px; border-left: 1px solid var(--rule); }
.yr::before { content: ""; position: absolute; top: 24px; bottom: 0; left: 50%; width: 1px; background: var(--rule); }
.yr.empty::before { display: none; }
.yr .y { position: relative; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.yr.here .y { color: var(--amber); }
.dot { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--mid); background: var(--panel-solid); padding: 0; cursor: pointer; transition: transform .3s, background .3s, opacity .4s; }
.dot:hover { transform: scale(1.35); }
.dot.seen { background: var(--mid); }
.dot.kept { box-shadow: 0 0 0 3px var(--panel-solid), 0 0 0 4.5px var(--sea); }
.dot.close { border-style: dashed; }
.dot.here { width: 18px; height: 18px; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 6px color-mix(in srgb, var(--amber) 22%, transparent); }
.dot.dim { opacity: 0.22; }
.dot .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--bg); padding: 4px 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: none; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 5; }
.dot:hover .tip, .dot:focus-visible .tip { opacity: 1; }
.threads { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.threads path { fill: none; stroke: var(--sea); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.85; animation: flow 1.6s linear infinite; }
.threads path.hot { stroke: var(--amber); stroke-width: 2.2; stroke-dasharray: none; opacity: 1; }
.threads path.hit { stroke: transparent; stroke-width: 14; stroke-dasharray: none; animation: none; opacity: 1; pointer-events: stroke; cursor: pointer; }
.dot.threadhot .tip { opacity: 0; }
/* The card for the thread under the pointer: just under the chart, lined up with the thread's far end. It sits
   outside the chart's scroller, which would clip it. */
.threadcard { position: absolute; z-index: 6; width: max-content; max-width: 300px; padding: 10px 12px; background: var(--panel-solid); border: 1px solid var(--amber); box-shadow: 0 6px 24px rgba(0,0,0,0.35); pointer-events: none; opacity: 0; transition: opacity .15s; }
.threadcard.on { opacity: 1; }
.threadcard .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
.threadcard .t { font-family: var(--display); font-size: 17px; margin-top: 4px; }
.threadcard .a { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 2px; }
.threadcard .n { font-size: 13px; line-height: 1.45; color: var(--ink); margin-top: 6px; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.tide { display: block; width: 100%; height: 26px; }

/* The stop */
.stage { flex: 1; padding-block: 18px 24px; }
.stop { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 48px; align-items: start; }
.left { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
.cover { position: relative; aspect-ratio: 1 / 1; width: 100%; }
.cover canvas { position: absolute; inset: -12%; width: 124%; height: 124%; pointer-events: none; }
.cover img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; box-shadow: 0 30px 60px rgba(0,0,0,0.35); }
.play { position: absolute; inset: 0; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; }
.play span { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--panel-solid) 78%, transparent); backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); opacity: 0; transform: scale(0.9); transition: opacity .25s, transform .25s; }
.play:hover span, .play:focus-visible span, .paused .play span { opacity: 1; transform: scale(1); }
.play svg { width: 26px; height: 26px; fill: var(--ink); }
.bar { height: 3px; background: var(--rule); }
.bar i { display: block; height: 3px; width: 0; background: var(--amber); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.act { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; backdrop-filter: blur(6px); }
.act:hover { border-color: var(--ink); color: var(--ink); }
.act[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--bg); }
.act svg { width: 14px; height: 14px; fill: currentColor; }
.status { color: var(--faint); min-height: 18px; }

.right { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.stamp { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--faint); }
.stamp .era { color: var(--ink); background: var(--card); padding: 4px 8px; }
.stamp .yy { color: var(--amber); }
.badge { border: 1px dashed var(--faint); padding: 3px 8px; color: var(--mid); }
h1.title { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(44px, 6.2vw, 92px); line-height: 0.95; letter-spacing: -0.025em; text-wrap: balance; }
.by { margin-top: -10px; font-size: 22px; font-style: italic; color: var(--mid); }
.quote { margin: 0; padding: 22px 0 0; border-top: 3px double var(--rule); }
.quote blockquote { margin: 0; font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(22px, 2.3vw, 30px); line-height: 1.35; text-wrap: pretty; }
.quote figcaption { margin-top: 10px; display: flex; gap: 10px; align-items: center; color: var(--faint); }
.quote figcaption button { all: unset; cursor: pointer; color: var(--sea); }
.quote figcaption button:hover { color: var(--amber); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sea); }
.sec p { margin: 0; max-width: 68ch; text-wrap: pretty; }
.listen { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.listen li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--rule); backdrop-filter: blur(6px); }
.listen li::before { content: ""; width: 9px; height: 9px; margin-top: 9px; border-radius: 50%; background: var(--amber); }
.listen .w { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; }
.leads { padding: 18px 20px; background: var(--panel); border: 1px solid var(--rule); backdrop-filter: blur(6px); }
.leads .t { font-size: 22px; font-family: var(--display); }
.leads .t i { color: var(--mid); }
.threadlist { display: flex; flex-direction: column; gap: 8px; }
.thread { all: unset; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 12px 14px; border: 1px solid var(--rule); background: var(--panel); backdrop-filter: blur(6px); }
.thread:hover, .thread:focus-visible { border-color: var(--sea); }
.thread .k { grid-row: span 2; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sea); padding-top: 4px; min-width: 76px; }
.thread .to { font-family: var(--display); font-size: 19px; }
.thread .to small { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 6px; }
.thread .n { font-size: 15px; color: var(--mid); line-height: 1.45; }
details.src { color: var(--faint); font-size: 14px; }
details.src summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
details.src ol { margin: 8px 0 0; padding-left: 20px; word-break: break-word; }
.yearnote { font-size: 14px; color: var(--faint); }

/* Reveal order: sound and cover first, then the voice, then the notes. */
.reveal > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.reveal > :nth-child(1) { animation-delay: .05s; } .reveal > :nth-child(2) { animation-delay: .5s; } .reveal > :nth-child(3) { animation-delay: .9s; }
.reveal > :nth-child(4) { animation-delay: 1.5s; } .reveal > :nth-child(5) { animation-delay: 2.1s; } .reveal > :nth-child(n+6) { animation-delay: 2.5s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Walk bar */
.walk { position: sticky; bottom: 0; z-index: 3; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--panel-solid) 40%); }
.walk .wrap { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.step { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--rule); background: var(--panel); backdrop-filter: blur(6px); max-width: 360px; }
.step:hover, .step:focus-visible { border-color: var(--ink); }
.step.next { justify-self: end; text-align: right; background: var(--ink); color: var(--bg); border-color: var(--ink); }
.step .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: .8; }
.step .s { font-family: var(--display); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step[hidden] { display: none; }
.keys { color: var(--faint); text-align: center; }

/* Overlays */
.layer { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: var(--bg); }
.layer[hidden] { display: none; }
.opening { display: grid; align-items: safe center; justify-items: center; background: #071013; color: #dbe7e5; --ink: #dbe7e5; --mid: #a9bfc0; --faint: #87a0a4; --sea: #74b8c4; --amber: #e0a35f; --rule: rgba(219,231,229,0.16); }
.opening .bgimg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.35; filter: saturate(0.8); }
.opening .inner { position: relative; width: 100%; max-width: 1100px; padding: 48px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 26px; }
.opening h1 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(58px, 11vw, 150px); line-height: 0.86; letter-spacing: -0.035em; }
.opening h1 i { font-weight: 500; color: var(--sea); }
.opening .lede { margin: 0; max-width: 40ch; font-size: clamp(19px, 2vw, 23px); color: var(--mid); }
.coastline { width: 100%; height: 90px; }
.coastline path { fill: none; stroke: var(--sea); stroke-width: 1.4; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 4.2s ease-in-out .3s forwards; }
.coastline circle { fill: var(--amber); opacity: 0; animation: pop .5s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { to { opacity: 1; } }
.go { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.big { min-height: 56px; padding: 0 26px; border: 0; background: var(--amber); color: #1a1208; cursor: pointer; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
.big:hover { filter: brightness(1.08); }
.ghost { min-height: 56px; padding: 0 20px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.ghost:hover { border-color: var(--ink); }
.panel-intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 14px; padding-top: 18px; border-top: 1px solid var(--rule); }
.judge b { display: block; font-family: var(--display); font-weight: 500; font-size: 18px; }
.judge span { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sea); margin: 2px 0 6px; }
.judge p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--mid); }
.fine { font-size: 13px; color: var(--faint); max-width: 70ch; }

.eracard { background: #071013; color: #dbe7e5; --ink: #dbe7e5; --mid: #b4c7c8; --faint: #8ea6aa; --sea: #74b8c4; --amber: #e0a35f; --rule: rgba(219,231,229,0.18); }
.eracard img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; animation: drift 40s ease-in-out infinite alternate; }
.eracard::before { content: ""; position: fixed; inset: 0; background: linear-gradient(90deg, rgba(5,11,13,.94) 0%, rgba(5,11,13,.78) 48%, rgba(5,11,13,.25) 100%); }
.eracard .inner { position: relative; max-width: 1360px; margin: 0 auto; padding: 56px max(20px, env(safe-area-inset-left, 0px)) 56px; display: flex; flex-direction: column; gap: 22px; }
.eracard .num { color: var(--amber); }
.eracard h2 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(48px, 8vw, 120px); line-height: .9; letter-spacing: -0.03em; max-width: 12ch; }
.eracard .essay { max-width: 62ch; font-size: 19px; line-height: 1.65; color: #cfdcdb; margin: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 18px; max-width: 980px; }
.facts div { border-top: 1px solid var(--rule); padding-top: 10px; }
.facts h3 { margin: 0 0 6px; font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--sea); }
.facts p { margin: 0; font-size: 15px; color: var(--mid); line-height: 1.5; }
.eracard .songs { display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: 980px; color: var(--mid); font-size: 15px; }
.eracard .songs span::after { content: " ·"; color: var(--faint); }
.eracard .songs span:last-child::after { content: ""; }

.map .inner, .ending .inner { max-width: 1100px; margin: 0 auto; padding: 40px max(20px, env(safe-area-inset-left, 0px)) 80px; display: flex; flex-direction: column; gap: 28px; }
.map h2, .ending h2 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(40px, 6vw, 72px); line-height: .95; letter-spacing: -.02em; }
.map .era h3 { margin: 0 0 8px; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sea); }
.map ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 6px; }
.map li button { all: unset; cursor: pointer; width: 100%; box-sizing: border-box; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 6px; border: 1px solid transparent; }
.map li button:hover, .map li button:focus-visible { border-color: var(--rule); background: var(--card); }
.map li img { width: 44px; height: 44px; object-fit: cover; }
.map li .t { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.map li .a { font-size: 13px; color: var(--faint); }
.map li.kept .t::after { content: "  ●"; color: var(--sea); font-size: 12px; }
.closebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.kept-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.kept-list li { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; }
.kept-list img { width: 56px; height: 56px; object-fit: cover; }


/* While the stage is up nothing behind it needs painting. */
html.stage-on .scene, html.stage-on .grain, html.stage-on .app { visibility: hidden; }

/* Stage: the lean-back companion for a second screen. It's laid out like a tiled Hyprland workspace (10px gaps,
   2px pane borders, one active pane in the theme's accent) and leaves the player's job to cliamp. The focus
   moves with the song: to the lyrics while someone sings, to the liner notes in between. Mono for what's live,
   the serif for the writing, like sleeve notes in a terminal. It's read from across the room, so nothing that
   carries information is under 18px or under 4.5:1 against the background. */
.stagev { --svbg: 9,5,3; --ink: #e3c2ad; --mid: #b39a8b; --faint: #968078; --sea: #a6e3a1; --amber: #b16237; --pane: #585b70; --rule: rgba(227,194,173,0.15);
  --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8; --tone: 116,184,196; --tmono: "JetBrainsMono Nerd Font", "JetBrains Mono", var(--mono);
  position: fixed; inset: 0; z-index: 11; overflow: hidden; background: rgb(var(--svbg)); color: var(--ink); font-family: var(--tmono); }
.stagev[hidden] { display: none; }
.stagev.still { cursor: none; }
.sv-grid { position: absolute; inset: 0; padding: 10px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(min-content, 0.75fr) minmax(0, 1.25fr) auto; grid-template-areas: "vis now" "vis lyr" "vis notes" "tonight tonight"; }
.stagev:not(.lyrics) .sv-grid { grid-template-areas: "vis now" "vis notes" "vis notes" "tonight tonight"; }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 2px solid var(--pane); background: rgba(var(--svbg), 0.72); transition: border-color .35s; }
.pl { display: flex; align-items: center; gap: 1ch; font-size: 18px; color: var(--green); white-space: nowrap; }
.pl .t { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.pl.rule::after { content: ""; flex: 1; min-width: 3ch; border-top: 1px solid currentColor; opacity: .4; }
.sv-vis { grid-area: vis; container-type: size; background: rgb(var(--svbg)); }
.sv-vis .pl { position: absolute; left: 0; top: 0; z-index: 4; padding: 6px 14px; background: rgb(var(--svbg)); }
.sv-vis .pl[hidden] { display: none; }
.sv-vis .bg, .sv-still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sv-vis .bg { opacity: .32; filter: saturate(.8); animation: drift 80s ease-in-out infinite alternate; }
.sv-vis .bg:not([src]), .sv-still:not([src]) { visibility: hidden; }
.sv-still { opacity: 0; transition: opacity 2.5s ease-in-out; }
.sv-still.on { opacity: .9; animation: drift 45s ease-in-out infinite alternate; }
/* Nothing to show yet (bridge down, nothing playing, a song with no cover): a quiet mark instead of a blank pane. */
.sv-empty { position: absolute; inset: 0; display: none; place-items: center; font-size: 34cqh; line-height: 1; color: rgba(var(--tone), .28); }
.stagev.nopic .sv-empty { display: grid; }
/* The hero picture in depth parallax (WebGL, the Astro-Arc shader). It fades in over the plain stills, which
   stay underneath as the fallback; once it's up, the stills and the era backdrop stop animating. */
.sv-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s ease-in-out; }
.sv-gl.on { opacity: 1; }
.stagev.glon .sv-vis .bg, .stagev.glon .sv-still { visibility: hidden; animation: none; }
.sv-vis .wash { position: absolute; inset: 0; pointer-events: none; transition: background 3s;
  background: radial-gradient(ellipse 42% 46% at 0% 100%, rgba(var(--tone), .34), transparent 70%),
    radial-gradient(ellipse 85% 80% at 50% 45%, transparent 55%, rgba(var(--svbg), .62) 100%),
    linear-gradient(0deg, rgba(var(--svbg), .55), transparent 30%); }
.sv-cover { position: absolute; left: 28px; bottom: 28px; z-index: 2; width: min(30cqh, 26cqw); aspect-ratio: 1 / 1; transition: opacity 1.2s; }
.stagev.bigcover .sv-cover { left: 50%; bottom: 50%; transform: translate(-50%, 50%); width: min(72cqh, 60cqw); }
.sv-cover img { display: block; width: 100%; height: 100%; object-fit: cover; outline: 1px solid var(--rule); transition: filter 2s; box-shadow: 0 22px 60px rgba(0,0,0,.6), 0 0 40px rgba(var(--tone), .25); }
.sv-cover img:not([src]) { visibility: hidden; }
.stagev.heropic:not(.cinema) #svNote.pic { grid-template-columns: minmax(0, 1fr); }
.stagev.heropic:not(.cinema) #svNote.pic img { display: none; }
/* Video comes only from the bridge's disk cache (GET /v/<id>.mp4), muted, steered to cliamp's clock. */
.sv-vid { position: absolute; inset: 0; z-index: 3; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity 1.8s, visibility 0s 1.8s; pointer-events: none; }
.sv-vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stagev.cinema .sv-vid { opacity: 1; visibility: visible; transition: opacity 1.8s; }
.stagev.cinema .sv-cover { opacity: 0; }
.stagev.paused .sv-vis img, .stagev.paused .sv-vis canvas, .stagev.paused .sv-vid { filter: grayscale(.5) brightness(.65); }
.sv-now { grid-area: now; padding: 22px 30px 24px; display: flex; flex-direction: column; gap: 10px; }
.sv-stamp { display: flex; flex-wrap: nowrap; gap: 4px 10px; min-width: 0; font-size: 18px; color: var(--faint); }
.sv-stamp > span { flex: none; white-space: nowrap; }
/* The number and year always show; the rest (close call, kept, album last) give way with an ellipsis, so the
   stamp stays on one line. */
.sv-stamp > span + span + span, .sv-stamp > span.album { flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; }
#svNoteLabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nw { white-space: nowrap; }
.sv-stamp b { font-weight: 400; color: var(--ink); }
.sv-stamp .yy b { color: var(--yellow); }
.sv-stamp .kept b { color: var(--green); }
.sv-title { margin: 0; font-size: min(6.4vh, 3.6vw); font-weight: 700; line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sv-by { font-size: max(18px, min(2.5vh, 1.5vw)); color: var(--green); }
.sv-by:not(:empty)::before { content: "♪\00a0"; }
.sv-era { font-size: 18px; color: var(--faint); }
.sv-era .jump { color: var(--mid); }
.sv-exit { position: absolute; top: 0; right: 0; z-index: 5; padding: 6px 14px; border: 0; border-left: 1px solid var(--pane); border-bottom: 1px solid var(--pane); background: rgb(var(--svbg)); color: var(--faint); font: 18px var(--tmono); cursor: pointer; }
.sv-exit:hover, .sv-exit:focus-visible { color: var(--ink); }
.sv-exit[hidden] { display: none; }
.sv-lyr { grid-area: lyr; padding: 22px 30px; display: flex; flex-direction: column; gap: 1.4vh; }
.sv-lyr .lines { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1vh; }
.stagev:not(.lyrics) .sv-lyr { display: none; }
.sv-lyr .now { font-size: min(4.2vh, 2.4vw); font-weight: 500; line-height: 1.2; min-height: 1.2em; text-wrap: balance; color: var(--mid);
  background: linear-gradient(90deg, var(--ink) var(--k, 0%), var(--mid) calc(var(--k, 0%) + 6%)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.stagev:not(.singing) .sv-lyr .now { background: none; -webkit-text-fill-color: var(--mid); }
.sv-lyr .now:not(:empty)::before { content: "▶ "; -webkit-text-fill-color: var(--green); }
.sv-lyr .nx { font-size: max(18px, min(2.5vh, 1.5vw)); color: var(--faint); min-height: 1.3em; padding-left: 2ch; }
.sv-notes { grid-area: notes; padding: 22px 30px; display: flex; flex-direction: column; gap: 2vh; }
.stagev.singing .sv-lyr, .stagev:not(.singing) .sv-notes { border-color: var(--amber); }
#svNote { flex: 1 1 auto; min-height: 0; overflow: hidden; }
/* A note too long for a small screen fades out at the bottom instead of being cut through a line. */
#svNote.clip { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 3em), transparent); }
#svNote code { display: block; margin-top: 1.2vh; font: max(18px, min(2.6vh, 1.5vw)) var(--tmono); color: var(--ink); white-space: nowrap; }
#svNote p { margin: 0; font-family: var(--body); font-size: max(18px, min(3.1vh, 1.75vw)); line-height: 1.42; color: var(--ink); text-wrap: pretty; transition: color .6s; }
.stagev.lyrics.singing #svNote p { color: var(--mid); }
#svNote p.q { font-family: var(--display); font-style: italic; font-weight: 300; font-size: max(20px, min(3.6vh, 2.05vw)); line-height: 1.3; }
#svNote b { display: block; margin-bottom: .8vh; font-family: var(--display); font-weight: 400; font-size: max(20px, min(3.5vh, 2vw)); line-height: 1.15; }
#svNote.pic { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 26px; align-items: start; }
#svNote.pic img { display: block; max-width: min(13vw, 260px); max-height: 30vh; object-fit: contain; outline: 1px solid var(--rule); }
.sv-tonight { grid-area: tonight; padding: 12px 26px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 26px; align-items: center; font-size: 18px; }
.sv-tonight .logo { color: var(--green); font-weight: 700; letter-spacing: .45em; }
.sv-track { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sv-bar { position: relative; height: 3px; background: color-mix(in srgb, var(--amber) 35%, transparent); }
.sv-bar i { display: block; height: 3px; width: 100%; background: var(--yellow); transform-origin: 0 50%; transform: scaleX(0); will-change: transform; }
.sv-bar b { position: absolute; top: -4px; width: 1px; height: 11px; background: color-mix(in srgb, var(--ink) 30%, transparent); }
.sv-bar b.done { background: var(--yellow); }
.sv-trail { display: block; width: 100%; height: 60px; overflow: visible; }
.sv-trail .era { stroke: var(--rule); }
.sv-trail .lbl { fill: var(--faint); font: 18px var(--tmono); }
.sv-trail circle.off { fill: color-mix(in srgb, var(--ink) 30%, transparent); }
.sv-trail circle.on { fill: var(--green); }
.sv-trail circle.here { fill: none; stroke: var(--yellow); stroke-width: 2; animation: breathe 2.4s ease-in-out infinite; }
.sv-trail .route { fill: none; stroke: var(--green); stroke-width: 1.2; opacity: .45; }
.sv-stat { display: flex; gap: 18px; align-items: baseline; white-space: nowrap; color: var(--faint); }
.sv-stat #svPos { color: var(--ink); font-size: 24px; font-variant-numeric: tabular-nums; }
.sv-stat #svLive { color: var(--green); }
.sv-stat #svLive.off { color: var(--faint); }
.sv-stat #svClock { color: var(--ink); font-size: 24px; font-variant-numeric: tabular-nums; }
#svToast { color: var(--yellow); }
.sv-keys { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 18px; color: var(--faint); transition: opacity 1.5s; max-height: 40px; overflow: hidden; }
/* Only the opacity fades: a transition on max-height kept Chromium laying out the page about five times a second. */
.sv-keys kbd { font: inherit; padding: 0 6px; margin-right: 6px; background: color-mix(in srgb, var(--ink) 20%, transparent); color: var(--ink); }
.sv-keys.hide { opacity: 0; max-height: 0; }
@media (max-width: 900px) {
  .stagev { overflow-y: auto; }
  .sv-grid { position: relative; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: auto; grid-template-areas: "vis" "tonight" "now" "lyr" "notes"; }
  .stagev:not(.lyrics) .sv-grid { grid-template-areas: "vis" "tonight" "now" "notes"; }
  .sv-vis { aspect-ratio: 16 / 9; }
  .sv-title { font-size: 34px; } .sv-by { font-size: 20px; }
  .sv-lyr .now { font-size: 24px; } .sv-lyr .nx { font-size: 18px; }
  #svNote p { font-size: 18px; } #svNote p.q { font-size: 20px; } #svNote b { font-size: 20px; }
  #svNote.pic { grid-template-columns: minmax(0, 1fr); } #svNote.pic img { max-width: 60%; }
  .sv-tonight { grid-template-columns: minmax(0, 1fr); padding: 10px 16px; }
  .sv-tonight > .pl, .sv-trail, .sv-keys, #svTrailNote, #svClock { display: none; }
  .sv-stat { flex-wrap: wrap; white-space: normal; gap: 4px 14px; }
  .sv-exit { display: none; }
}

@media (max-width: 900px) {
  body { font-size: 17px; }
  .stop { grid-template-columns: 1fr; gap: 28px; }
  .left { position: static; max-width: 420px; }
  .walk .wrap { grid-template-columns: 1fr 1fr; }
  .keys { display: none; }
  .brand span { display: none; }
  .tools { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 4px; }
  .lenses { flex-wrap: nowrap; }
  .chip { flex: none; }
}
/* Hidden tooltips near the right edge of the chart used to widen the page on phones. clip (not hidden) keeps sticky positioning working. */
html, body { overflow-x: clip; }
/* Small screens (a 1366x768 laptop, the 1024x600 panel): tighter panes, so lyrics and notes keep whole lines. */
@media (min-width: 901px) and (max-height: 800px) {
  .sv-grid { padding: 8px; gap: 8px; }
  .sv-now { padding: 14px 22px 16px; gap: 6px; }
  .sv-lyr, .sv-notes { padding: 14px 22px; }
  .sv-tonight { padding: 8px 20px; }
  .sv-trail { height: 44px; }
}
@media (min-width: 901px) and (max-height: 700px) {
  .sv-lyr .nx, .sv-trail, #svTrailNote { display: none; }
  .sv-tonight { grid-template-columns: auto minmax(0, 1fr) auto; }
}
/* The opening has to fit a 1366x768 laptop without scrolling to the title. */
@media (max-height: 820px) {
  .opening .inner { gap: 16px; padding-block: 24px; }
  .opening h1 { font-size: clamp(48px, 13vh, 110px); }
  .opening .lede { font-size: 18px; }
  .coastline { height: 60px; }
  .panel-intro { padding-top: 12px; }
  .judge p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .coastline path { stroke-dashoffset: 0; } .coastline circle { opacity: 1; }
  .scene img.on { transform: none; }
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><img id="sceneA" alt=""><img id="sceneB" alt=""></div>
<div class="grain" aria-hidden="true"></div>

<div class="app" id="app" hidden>
  <header class="top"><div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Open the map of every stop"><b id="brandTitle"></b><span class="mono" id="brandSub"></span></button>
    <div class="tools">
      <div class="lenses" id="lenses" role="group" aria-label="Walk through one judge's picks"></div>
      <button class="chip" id="followBtn" type="button" aria-pressed="true" hidden title="Follow what cliamp is playing (F)"><span class="live-dot"></span><span class="lbl">cliamp</span></button>
      <button class="chip" id="stageBtn" type="button" aria-pressed="false" hidden title="Lean-back view for a second screen (S)">Stage</button>
      <button class="chip" id="drift" type="button" aria-pressed="false" title="Play each preview and move on by itself (D)">Drift</button>
      <button class="chip" id="threadsBtn" type="button" aria-pressed="false" title="Show this stop's threads on the chart (T)">Threads</button>
      <button class="chip" id="mapBtn" type="button" title="Every stop (M)">Map</button>
      <button class="chip" id="themeBtn" type="button" aria-label="Switch light or dark">Light</button>
    </div>
  </div></header>

  <nav class="chart" aria-label="The coastline: every song by release year"><div class="threadcard" id="threadCard" aria-hidden="true"></div><div class="wrap"><div class="scroll" id="chartScroll">
    <div class="coast" id="coast">
      <div class="eras" id="eraRow"></div>
      <div class="years" id="years"></div>
      <svg class="threads" id="threadSvg" aria-hidden="true"></svg>
      <canvas class="tide" id="tide" aria-hidden="true"></canvas>
    </div>
  </div></div></nav>

  <main class="stage"><div class="wrap"><article class="stop" id="stop" aria-live="off"></article></div></main>

  <footer class="walk"><div class="wrap">
    <button class="step prev" id="prev" type="button"><span class="l">← West</span><span class="s"></span></button>
    <div class="keys mono" id="pageKeys"></div>
    <button class="step next" id="next" type="button"><span class="l">East →</span><span class="s"></span></button>
  </div></footer>
</div>

<section class="layer opening" id="opening" aria-labelledby="openTitle">
  <img class="bgimg" id="openImg" alt="">
  <div class="inner">
    <div class="mono" id="openKicker" style="color: var(--sea)"></div>
    <h1 id="openTitle"></h1>
    <p class="lede" id="openLede"></p>
    <svg class="coastline" id="openCoast" viewBox="0 0 1000 90" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="go">
      <button class="big" id="start" type="button"></button>
      <button class="ghost" id="express" type="button"></button>
      <button class="ghost" id="companion" type="button">Companion mode</button>
    </div>
    <p class="fine" id="companionNote"></p>
    <div class="panel-intro" id="panelIntro"></div>
    <p class="fine" id="panelNote"></p>
  </div>
</section>

<section class="layer eracard" id="eracard" hidden aria-labelledby="eraTitle">
  <img id="eraImg" alt="">
  <div class="inner">
    <div class="mono num" id="eraNum"></div>
    <h2 id="eraTitle"></h2>
    <p class="essay" id="eraEssay"></p>
    <div class="facts" id="eraFacts"></div>
    <div class="songs" id="eraSongs"></div>
    <div class="go"><button class="big" id="eraGo" type="button">Into the era</button></div>
  </div>
</section>

<section class="layer map" id="map" hidden aria-labelledby="mapTitle">
  <div class="inner">
    <div class="closebar"><h2 id="mapTitle">Every stop</h2><button class="ghost" id="mapClose" type="button">Close (Esc)</button></div>
    <div id="mapBody" style="display:flex;flex-direction:column;gap:28px"></div>
  </div>
</section>

<section class="layer ending" id="ending" hidden aria-labelledby="endTitle">
  <div class="inner" id="endBody"></div>
</section>

<section class="stagev" id="stagev" hidden aria-label="Now playing in cliamp. Press Esc for the full page.">
  <div class="sv-grid" id="svIn">
    <div class="pane sv-vis">
      <img class="bg" id="svBg" alt="">
      <img class="sv-still" id="svStillA" alt=""><img class="sv-still" id="svStillB" alt="">
      <canvas class="sv-gl" id="svGl" aria-hidden="true"></canvas>
      <div class="sv-empty" aria-hidden="true">♪</div>
      <div class="wash"></div>
      <div class="sv-cover"><img id="svCover" alt=""></div>
      <div class="sv-vid" aria-hidden="true"></div>
      <div class="pl" id="svVisLabel">•— cliamp</div>
      <button class="sv-exit" id="svExit" type="button" title="The full page for this journey (Esc)">full page · Esc</button>
    </div>
    <div class="pane sv-now">
      <div class="pl">•— now <span class="t sv-stamp" id="svStamp"></span></div>
      <h2 class="sv-title" id="svTitle"></h2>
      <div class="sv-by" id="svBy"></div>
      <div class="sv-era" id="svEra"></div>
    </div>
    <div class="pane sv-lyr" id="svLyric" aria-hidden="true">
      <div class="pl">•— lyrics <span class="t" id="svLyrState"></span></div>
      <div class="lines"><div class="now"></div><div class="nx"></div></div>
    </div>
    <div class="pane sv-notes">
      <div class="pl rule"><span id="svNoteLabel">notes</span></div>
      <div id="svNote" aria-live="polite"></div>
    </div>
    <div class="pane sv-tonight">
      <div class="pl">•— <span class="logo" id="svBrand"></span></div>
      <div class="sv-track"><div class="sv-bar" id="svBar"><i id="svFill"></i></div><svg class="sv-trail" id="svTrail" aria-hidden="true"></svg></div>
      <div class="sv-stat"><span id="svToast"></span><span id="svPos"></span><span id="svTrailNote"></span><span id="svLive"></span><span id="svClock"></span></div>
      <div class="sv-keys" id="svKeys"></div>
    </div>
  </div>
</section>

<div class="sr" aria-live="polite" id="live"></div>
<audio id="pv" crossorigin="anonymous" preload="none"></audio>

<script>window.JOURNEY = /*__DATA__*/null;</script>
<script>
(() => {
  /* The data blob comes from liner_notes/build.py. A page built with no journey (/p/live.html) gets an empty one
     and is only the live stage: whatever cliamp plays, with lyrics, a cover when the cache has one, and the trail. */
  const RAW = window.JOURNEY || {};
  const D = { slug: 'live', title: 'Liner Notes', titleA: 'Liner', titleB: 'Notes', kicker: '', lede: '', judges: {}, express: { note: '', n: [] }, eras: [], stops: [], ...RAW };
  D.copy = { start: 'Start listening', express: 'Express route', companion: '', panelNote: '', resume: 'Back to', endKept: '', endEmpty: '', credits: '', ...(RAW.copy || {}) };

    t = t.replace(/\s*[(\[][^()\[\]]*\bversion\b[^()\[\]]*[)\]]\s*$/i, '');
    return { title: t || String(n.title || ''), artist: a };
  }
  // The build draws a lettered square when there's no cover; on the stage the card just stays away.
  const realCover = c => !!c && !/^data:image\/svg\+xml/.test(c);
  const trackKey = n => n ? n.yt || (n.song ? 'song:' + n.song : `${n.artist || ''}|${n.title || ''}`) : null;
  function renderStage() {
    const n = sync.on ? sync.now : null, s = stopFor(n), key = trackKey(n);
    if (s && stg.s && stg.s !== s) stg.prev = stg.s;
    const fresh = key !== stg.key;
    stg.key = key; stg.n = n; stg.dur = n ? n.duration || 0 : 0; stg.s = s;
    SV.classList.toggle('offlist', !s);
    setText($('#svBrand'), D.title.toUpperCase());
    if (fresh) {
      stg.lines = null; stg.shown = false; stg.line = -2; stg.firstVocal = null; stg.cover = null; stg.artistImg = null; stg.freshAt = performance.now();
      stg.offset = parseFloat(store.get('journey-lyric-offset-' + ((n && n.yt) || (s && s.yt) || (n && n.song) || ''))) || 0;
      $('#svLyric .now').textContent = ''; $('#svLyric .nx').textContent = ''; SV.classList.remove('lyrics', 'singing');
      $('#svCover').removeAttribute('src'); SV.classList.remove('bigcover');
      replay($('#svTitle'), 'fresh');
      if (n) { fetchLyrics(key, n); fetchPlays(); localIds(performance.now(), performance.now()); }
    }
    stg.beats = []; stg.beat = -1;
    if (!s) {
      stg.eraParts = []; $('#svEra').replaceChildren(); $('#svStamp').replaceChildren();
      $('#svBg').removeAttribute('src');
      if (sync.down) { setText($('#svTitle'), 'The bridge isn’t running'); setText($('#svBy'), ''); setText($('#svEra'), 'Nothing can follow cliamp until it’s back.'); }
      else if (!n) { setText($('#svTitle'), sync.reason === 'no-player' ? 'cliamp isn’t running' : 'Nothing playing'); setText($('#svBy'), ''); }
      else {
        const pl = n.playlist && n.playlist !== D.title ? n.playlist : '', d = displayTitle(n);
        $('#svStamp').append(...[pl ? el('span', { class: 'album', title: pl }, '[', el('b', { text: pl }), ']') : null, LIVE ? null : el('span', { text: `not on ${D.title}` })].filter(Boolean));
        setText($('#svTitle'), d.title); setText($('#svBy'), d.artist); setText($('#svEra'), n.album || '');
        if (fresh) findCover(n, key);
      }
      paintTicks(); paintNote(null); paintTrail(); paintStageKeys(); return;
    }
    const e = eraOf(s);
    if (e.image && $('#svBg').getAttribute('src') !== e.image) $('#svBg').src = e.image;
    const an = SD && SD.artists && Object.keys(SD.artists).filter(a => s.artist === a || s.artist.includes(a)).sort((a, b) => b.length - a.length)[0];
    stg.artistImg = an && SERVED && /^[\w./-]+$/.test(SD.artists[an]) ? BRIDGE + '/m/' + D.slug + '/' + SD.artists[an] : null; stg.artistName = an || '';
    if (realCover(s.cover)) { $('#svCover').src = s.cover; toneOf('n' + s.n, s.cover).then(t => { if (stg.s === s) SV.style.setProperty('--tone', t); }); }
    else $('#svCover').removeAttribute('src');
    const draft = s.draft ? el('span', { class: 'nw', text: 'draft notes, AI-written' }) : null;
    stg.eraParts = e.n ? [`era ${e.n}/${eras.length} · ${e.name} · ${e.years}`, ...(draft ? [' · ', draft] : [])] : draft ? [draft] : [];
    setText($('#svTitle'), s.title); setText($('#svBy'), s.artist); paintStamp();
    stg.beats = beatsFor(s, stg.dur, stg.prev, stg.firstVocal); stg.beat = -1; paintTicks(); paintNote(null); paintTrail(); paintStageKeys();
  }
  const showKeys = () => { $('#svKeys').classList.remove('hide'); clearTimeout(stg.keys); stg.keys = setTimeout(() => $('#svKeys').classList.add('hide'), 20000); };
  const toast = msg => { $('#svToast').textContent = msg; clearTimeout(stg.toast); stg.toast = setTimeout(() => { $('#svToast').textContent = ''; }, 2600); };
  const offsetKey = () => 'journey-lyric-offset-' + ((stg.n && stg.n.yt) || (stg.s && stg.s.yt) || (stg.n && stg.n.song) || '');
  function nudgeLyrics(d) { if (!stg.n || !stg.lines) return; stg.offset = Math.round((stg.offset + d) * 10) / 10; store.set(offsetKey(), String(stg.offset)); stg.line = -2; toast(`Lyrics ${stg.offset > 0 ? '+' : ''}${stg.offset}s`); }
  function nudgeLead(d) { lyricLead = Math.round((lyricLead + d) * 100) / 100; store.set('journey-lyric-lead', String(lyricLead)); stg.line = -2; toast(`Lyrics ${lyricLead}s early, every song`); }
  function toggleLyrics() {
    stg.lyricsOn = !stg.lyricsOn; toast(stg.lyricsOn ? 'Lyrics on' : 'Lyrics off for now');
    if (stg.lyricsOn) { if (stg.lines) stg.shown = true; else if (stg.n) fetchLyrics(stg.key, stg.n); }
    else SV.classList.remove('lyrics', 'singing');
  }

  /* The stage runs on two clocks: the words, the notes and the video four times a second, and only the lyric sweep
     and the progress bar every frame. Both stop in a hidden tab. */
  function modeOf() { const n = sync.on ? sync.now : null; return sync.down ? 'down' : !n ? 'none:' + sync.reason : 'song:' + trackKey(n); }
  function tickStage() {
    const now = performance.now(), n = sync.on ? sync.now : null;
    const mode = modeOf();
    if (mode !== stg.mode) { stg.mode = mode; renderStage(); }
    else if (n && n.duration && n.duration !== stg.dur && stg.s) { stg.dur = n.duration; stg.beats = beatsFor(stg.s, stg.dur, stg.prev, stg.firstVocal); stg.beat = -1; paintTicks(); }
    const playing = !!(n && n.state === 'playing');
    SV.classList.toggle('paused', !playing);
    const d = new Date();
    if (d.getMinutes() !== stg.minute) {
      stg.minute = d.getMinutes(); setText($('#svClock'), d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      if (!reduced) $('#svIn').style.transform = `translate(${(Math.random() * 16 - 8).toFixed(1)}px, ${(Math.random() * 12 - 6).toFixed(1)}px)`;
    }
    const liveEl = $('#svLive'), liveTxt = sync.down ? '○ bridge down' : !n ? (sync.reason === 'no-player' ? '○ no cliamp' : '○ stopped') : playing ? '● ' + (n.source || 'cliamp') : '○ paused';
    setText(liveEl, liveTxt); liveEl.classList.toggle('off', !playing);
    if (!n) { syncVideo(now, 0, false); paintVis(false); setText($('#svPos'), ''); $('#svFill').style.transform = 'scaleX(0)'; return; }
    const pos = posNow(now), dur = n.duration || 0, flow = flowing(n);
    setText($('#svPos'), `${playing ? '▶' : '⏸'} ${fmt(pos)} / ${fmt(dur)}`);
    syncVideo(now, pos, flow);
    let k = -1; for (let i = 0; i < stg.beats.length; i++) if (stg.beats[i].at <= pos) k = i;
    if (k !== stg.beat) { stg.beat = k; if (stg.lines && !stg.shown) stg.shown = true; paintNote(stg.beats[k]); }
    if (!stg.s && stg.lines && !stg.shown) stg.shown = true;
    paintVis(playing);
    const L = stg.lyricsOn && stg.shown && stg.lines ? stg.lines : null;
    if (SV.classList.contains('lyrics') !== !!L) { SV.classList.toggle('lyrics', !!L); fitNote(); }
    if (L) {
      const p = pos - stg.offset + lyricLead; let li = -1; for (let i = 0; i < L.length; i++) if (L[i].start <= p) li = i;
      const cur = L[li], nx = L[li + 1];
      const singing = !!(playing && cur && cur.text && (p - cur.start < 7 || (nx && nx.start - p < 5)));
      SV.classList.toggle('singing', singing);
      setText($('#svLyrState'), !playing ? '· paused' : singing ? '· singing' : nx ? `· instrumental · next line in ${fmt(nx.start - p)}` : '· instrumental');
      if (li !== stg.line) {
        stg.line = li; const nxt = L.slice(li + 1).find(x => x.text);
        setText($('#svLyric .now'), cur && cur.text ? cur.text : ''); setText($('#svLyric .nx'), nxt ? nxt.text : '');
        if (!reduced) $('#svLyric .now').animate([{ transform: 'translateY(5px)' }, { transform: 'none' }], { duration: 220, easing: 'ease-out' });
      }
    } else SV.classList.remove('singing');
    kickSweep();
  }
  function stageLoop() { stg.loop = 0; if (!stg.on || document.hidden) return; tickStage(); stg.loop = setTimeout(stageLoop, 250); }
  const kickSweep = () => { if (!stg.raf && stg.on && !document.hidden) stg.raf = requestAnimationFrame(sweep); };
  function sweep() {
    stg.raf = 0;
    const n = sync.on ? sync.now : null; if (!stg.on || document.hidden || !n) return;
    const now = performance.now(), pos = posNow(now), dur = n.duration || 0;
    $('#svFill').style.transform = `scaleX(${dur ? Math.min(1, pos / dur).toFixed(4) : 0})`;
    const L = SV.classList.contains('lyrics') && stg.lines, cur = L && L[stg.line], nx = L && L[stg.line + 1];
    if (cur) { const p = pos - stg.offset + lyricLead; $('#svLyric .now').style.setProperty('--k', Math.min(100, Math.max(0, (p - cur.start) / Math.max(0.8, ((nx ? nx.start : cur.start + 4) - cur.start) * 0.85) * 100)).toFixed(1) + '%'); }
    if (flowing(n)) stg.raf = requestAnimationFrame(sweep);
  }

  function enterStage() {
    if (stg.on) return;
    if (sync.on && !sync.follow) setFollow(true);
    stg.on = true; stg.mode = undefined; stg.minute = -1; SV.hidden = false; document.documentElement.classList.add('stage-on'); document.documentElement.style.overflow = 'hidden'; $('#stageBtn').setAttribute('aria-pressed', 'true');
    $('#svExit').hidden = LIVE;
    clearTimeout(stg.idle); requestAnimationFrame(paintTrail); loadStageData(); showKeys(); syncBands(); keepAwake();
    if (!stg.loop) stageLoop(); poll();
  }
  function exitStage() {
    if (LIVE) return;
    hero.set(false, false); if (lv.el) lv.el.pause();
    stg.on = false; SV.hidden = true; document.documentElement.classList.remove('stage-on'); document.documentElement.style.overflow = ''; $('#stageBtn').setAttribute('aria-pressed', 'false');
    if (wake) { wake.release().catch(() => {}); wake = null; }
    render(); poke(); syncBands(); kickDraw();
  }
  /* In companion mode the page goes back to the stage after a minute and a half without input. */
  const poke = () => { clearTimeout(stg.idle); if (state.companion && state.started && !LIVE) stg.idle = setTimeout(() => { if (!stg.on && !anyOpen() && sync.on) enterStage(); }, 90000); };
  ['keydown', 'pointerdown', 'wheel'].forEach(ty => addEventListener(ty, () => { if (!stg.on) poke(); }, { passive: true }));
  /* A click on the stage stays on the stage; the corner button (or Esc) leads to the full page. The pointer shows
     while it moves and hides after 3 seconds still. */
  $('#svExit').onclick = ev => { ev.stopPropagation(); exitStage(); };
  // On a phone the corner button is gone; a tap on the title opens the full page.
  $('#svTitle').addEventListener('click', () => { if (matchMedia('(max-width: 900px)').matches && stg.s) exitStage(); });
  SV.addEventListener('pointermove', () => { SV.classList.remove('still'); clearTimeout(stg.still); stg.still = setTimeout(() => SV.classList.add('still'), 3000); }, { passive: true });
  $('#stageBtn').onclick = () => stg.on ? exitStage() : enterStage();
  addEventListener('resize', () => { if (stg.on) paintTrail(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (lv.el) lv.el.pause(); syncBands(); return; }
    poll(); themeLoop(); syncBands(); keepAwake(); kickDraw();
    if (stg.on && !stg.loop) stageLoop();
  });

  /* ---------- start ---------- */
  const resumed = readHash();
  const begin = (mode) => {
    if (mode === 'companion') state.companion = true;
    if (mode === 'express') state.lens = 'express';
    state.started = true; $('#opening').hidden = true;
    if (LIVE) return;
    $('#app').hidden = false;
    setLens(state.lens);
    const s = stops[state.i]; state.erasShown.add(s.era);
    render(); readColors();
    if (sync.on) { setStatus(syncStatus(s)); setPaused(!(sync.now && stopFor(sync.now) === s && sync.now.state === 'playing')); }
    else if (mode !== 'companion' && !state.companion) playPreview(true);
    syncBands(); kickDraw();
  };
  // The opening's companion button names the playing song as soon as any answer from the bridge names one.
  function paintOpening() {
    if (state.started || LIVE) return;
    const s = sync.on && stopFor(sync.now), b = $('#companion');
    if (s) { b.textContent = `Follow cliamp · ${s.title}`; b.classList.replace('ghost', 'big'); $('#start').classList.replace('big', 'ghost'); }
    else if (b.classList.contains('big')) { b.textContent = 'Companion mode'; b.classList.replace('big', 'ghost'); $('#start').classList.replace('ghost', 'big'); }
  }
  $('#start').onclick = () => { ensureAudio(); if (sync.on) setFollow(false); begin('play'); };
  $('#express').onclick = () => { ensureAudio(); state.i = Math.max(0, stops.findIndex(s => D.express.n.includes(s.n))); begin('express'); };
  $('#companion').onclick = () => { ensureAudio(); const s = sync.on && stopFor(sync.now); if (s) state.i = stops.indexOf(s); begin('companion'); enterStage(); };

  // Companion mode (and the live page) goes straight to the stage, which has something to say in every state:
  // bridge down, no cliamp, nothing playing, a song with no notes. It never waits on a first answer.
  if (state.companion) { begin('companion'); enterStage(); }

  themeLoop();

  // A read-only window for the headless checks in tools/scenarios.js.
  window.LinerNotes = Object.freeze({
    stage: () => ({ on: stg.on, mode: stg.mode, key: stg.key, beat: stg.beat, beats: stg.beats.map(b => ({ at: b.at, label: b.label, kind: b.kind || '' })), lines: !!stg.lines, shown: stg.shown, live: LIVE, hero: stg.hero && stg.hero.kind, video: lv.id, videoLive: lv.live, videoFailed: [...lv.failed.keys()], videoIds: [...lv.ids], sync: sync.on }),
    hero: () => hero.stats(),
    keeps: () => [...state.keep],

})();
