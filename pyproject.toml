[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "liner-notes"
version = "0.3.0.dev0"
description = "A second screen for cliamp: liner notes, lyrics and pop culture that follow what you play."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
media = ["Pillow>=10"]
depth = ["numpy>=1.26", "Pillow>=10", "onnxruntime>=1.17"]
remix = ["numpy>=1.26"]
generate = ["anthropic>=1.15"]
dev = ["pytest>=8", "ruff>=0.6", "Pillow>=10", "anthropic>=1.15"]

[project.scripts]
liner-notes = "liner_notes.cli:main"

[tool.setuptools.packages.find]
include = ["liner_notes*"]

[tool.setuptools.package-data]
liner_notes = ["web/*", "prompts/*.md", "style.toml", "data/*", "schemas/*.json", "shipped/**/*"]

[tool.setuptools.exclude-package-data]
# The journeys' working notes stay in the repo; the tool doesn't read them.
liner_notes = ["shipped/journeys/*/REVIEW.md", "shipped/journeys/*/CORRECTIONS.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "B008"]

[tool.ruff.lint.per-file-ignores]
# Shared fixtures are imported from tests/helpers_build.py and then named as test arguments.
"tests/*" = ["F811"]
