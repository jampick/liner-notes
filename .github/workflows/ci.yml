name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit; the comment says which release that is.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Songs and journeys match their schemas
        run: liner-notes check
      - name: Nothing personal in the tree or in a public build
        run: liner-notes check --publish

  install:
    # What someone who only has the package gets: a clean venv, no checkout on the path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build the wheel and install it into a fresh venv
        run: |
          pip wheel --no-deps -w /tmp/wheel .
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install /tmp/wheel/liner_notes-*.whl
      - name: The wheel carries the bank and the schemas
        working-directory: /tmp
        env:
          XDG_DATA_HOME: /tmp/xdg/data
          XDG_CACHE_HOME: /tmp/xdg/cache
          XDG_STATE_HOME: /tmp/xdg/state
          XDG_CONFIG_HOME: /tmp/xdg/config
        run: |
          /tmp/clean/bin/liner-notes list | tee /tmp/list.txt
          n=$(tail -n 1 /tmp/list.txt | cut -d' ' -f1)
          test "$n" -gt 200 || { echo "only $n songs in the bank"; exit 1; }
          /tmp/clean/bin/liner-notes check
      - name: A review lands in user data and leaves site-packages alone
        working-directory: /tmp
        env:
          XDG_DATA_HOME: /tmp/xdg/data
          XDG_CACHE_HOME: /tmp/xdg/cache
          XDG_STATE_HOME: /tmp/xdg/state
          XDG_CONFIG_HOME: /tmp/xdg/config
        run: |
          songs=$(/tmp/clean/bin/python -c 'from liner_notes import paths; print(paths.home() / "songs")')
          f=$(ls "$songs"/*.json | head -n 1)
          sid=$(basename "$f" .json)
          before=$(sha256sum "$f")
          if /tmp/clean/bin/liner-notes review "$sid"; then echo "review ran without --by"; exit 1; fi
          /tmp/clean/bin/liner-notes review "$sid" --by CI
          test "$(sha256sum "$f")" = "$before"
          grep -q '"sha256"' "/tmp/xdg/data/liner-notes/songs/$sid.json"
          /tmp/clean/bin/liner-notes doctor || true
      - name: The command runs and the bridge starts and stops
        working-directory: /tmp
        run: |
          /tmp/clean/bin/liner-notes --version
          /tmp/clean/bin/liner-notes build live --out /tmp/live.html
          grep -q '"slug":"live"' /tmp/live.html
          /tmp/clean/bin/liner-notes serve --port 0 > /tmp/serve.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
          cat /tmp/serve.log

  pages:
    runs-on: ubuntu-latest
    env:
      LINER_NOTES_DIST: dist
      CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install -e .
      - run: cd tools && npm install --no-audit --no-fund
      - name: Build the example journey, for sharing and for the stage
        run: |
          liner-notes build downtempo-drift --public --out dist/downtempo-drift.public.html
          liner-notes build downtempo-drift
          liner-notes build live
      - name: ffmpeg, for the scenarios' test-pattern video
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Headless checks of the shareable page (both themes, phone width, disclosures)
        run: |
          mkdir -p shots
          node tools/shoot.js dist/downtempo-drift.public.html shots
      - name: Page scenarios on a fake bridge
        if: hashFiles('tools/scenarios.js') != ''
        run: node tools/scenarios.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: shots/
